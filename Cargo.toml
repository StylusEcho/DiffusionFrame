[package]
name = "diffusionframe"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "A lean desktop frame for ComfyUI, Stable Diffusion WebUI and friends"
license = "MIT"

[lib]
name = "diffusionframe"
path = "src/lib.rs"

[[bin]]
name = "diffusionframe"
path = "src/main.rs"
required-features = ["app"]

[features]
default = ["app"]
# The windowing and webview stack. Off, the crate is just its logic, which is
# how the tests run on hosts without a system webview (CI, Linux checkouts).
app = ["dep:tao", "dep:wry"]

[dependencies]
tao = { version = "0.34", optional = true }
wry = { version = "0.56", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
